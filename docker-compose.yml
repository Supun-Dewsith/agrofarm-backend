services:
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/app.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      agrofarm-backend:
        condition: service_healthy
      python-microservice:
        condition: service_started
    networks:
      - agro-network

  agrofarm-backend:
    build:
      context: ./agrofarm-backend
      dockerfile: Dockerfile
    container_name: agrofarm-backend
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - agro-network

  python-microservice:
    build:
      context: ./python-microservice
      dockerfile: Dockerfile
    container_name: python-microservice
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - agro-network

networks:
  agro-network:
    driver: bridge