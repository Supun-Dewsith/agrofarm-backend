spring:
  application:
    name: agrofarm-backend
  datasource:
    url: jdbc:mysql://localhost:3306/agrofarm_db?createDatabaseIfNotExist=true
    username: YOUR_DATABASE_USERNAME
    password: YOUR_DATABASE_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate